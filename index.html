<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Especial ❤️</title>
    <style>
        body {
            background-color: #ffe6e8;
            font-family: Arial, sans-serif;
            text-align: center;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 40px;
            padding: 0 20px;
        }
        .botoes {
            position: relative;
            width: 100%;
            height: 100px;
        }
        button {
            font-size: 18px;
            font-weight: bold;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #btnSim {
            background-color: #28a745;
            position: absolute;
            left: calc(50% - 110px);
        }
        #btnNao {
            background-color: #dc3545;
            position: absolute;
            left: calc(50% + 10px);
        }
    </style>
</head>
<body>

    <h1>Querias namorar comigo? ❤️</h1>
    
    <div class="botoes">
        <button id="btnSim" onclick="aceitou()">SIM!</button>
        <button id="btnNao" onmouseover="fugir()" ontouchstart="fugir()">Não</button>
    </div>

    <script>
        function aceitou() {
            alert("Sabia que ias aceitar! 🥰 Prometo fazer-te muito feliz!");
            location.reload();
        }

        function fugir() {
            const btnNao = document.getElementById('btnNao');
            const larguraJanela = window.innerWidth - 100;
            const alturaJanela = window.innerHeight - 100;
            
            const randomX = Math.random() * larguraJanela;
            const randomY = Math.random() * alturaJanela;
            
            btnNao.style.left = randomX + 'px';
            btnNao.style.top = randomY + 'px';
        }
    </script>
</body>
</html>
